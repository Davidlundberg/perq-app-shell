<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Perq — Credit Card Benefits Tracker</title>
<!-- PWA: installable app shell + iOS standalone polish (closet precedent) -->
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="static/icon-192.png" />
<link rel="apple-touch-icon" href="static/icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Perq" />
<!-- Matches --bg in light/dark (see :root below). -->
<meta name="theme-color" content="#f6f7f9" />
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b1120" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --accent: #0d9488;
    --accent-strong: #0f766e;
    --accent-soft: #ccfbf1;
    --good: #15803d;
    --good-bg: #dcfce7;
    --bad: #b91c1c;
    --bad-bg: #fee2e2;
    --warn: #b45309;
    --warn-bg: #fef3c7;
    --bg: #f6f7f9;
    --surface: #ffffff;
    --surface-2: #f1f5f9;
    --border: #e2e8f0;
    --text: #0f172a;
    --text-soft: #475569;
    --text-faint: #94a3b8;
    --shadow: 0 1px 2px rgba(15,23,42,.04), 0 4px 16px rgba(15,23,42,.06);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --accent: #2dd4bf;
      --accent-strong: #5eead4;
      --accent-soft: #134e4a;
      --good: #4ade80;
      --good-bg: #052e16;
      --bad: #f87171;
      --bad-bg: #450a0a;
      --warn: #fbbf24;
      --warn-bg: #422006;
      --bg: #0b1120;
      --surface: #111827;
      --surface-2: #1e293b;
      --border: #1f2937;
      --text: #f1f5f9;
      --text-soft: #cbd5e1;
      --text-faint: #64748b;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    line-height: 1.4;
  }
  .wrap { max-width: 1060px; margin: 0 auto; padding: 22px 18px 80px; }

  /* Header */
  header.app { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand h1 { font-size: 26px; font-weight: 800; letter-spacing: -.02em; margin: 0; }
  .brand .dot { color: var(--accent); }
  .brand .sub { color: var(--text-faint); font-size: 13px; font-weight: 500; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; }

  button {
    font-family: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer;
    border-radius: 10px; border: 1px solid var(--border); background: var(--surface);
    color: var(--text); padding: 9px 13px; transition: .12s; line-height: 1;
  }
  button:hover { border-color: var(--accent); color: var(--accent-strong); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: var(--accent-strong); color: #fff; }
  button.ghost { background: transparent; }
  button.danger:hover { border-color: var(--bad); color: var(--bad); }
  button.tiny { padding: 5px 9px; font-size: 12px; border-radius: 8px; }
  button.autosave-cta { border-color: var(--accent); color: var(--accent-strong); }
  button.autosave-cta:hover { background: var(--accent-soft); }

  /* auto-save status bar */
  .autosave-bar { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--good); border-radius: 10px; padding: 9px 13px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .autosave-bar .as-text { flex: 1; font-size: 13px; color: var(--text-soft); }
  .autosave-bar .as-text b { color: var(--text); }
  .as-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--good); flex: 0 0 auto; }
  .as-dot[data-status="saving"] { background: var(--warn); }
  .as-dot[data-status="error"] { background: var(--bad); }

  /* account / cloud sync */
  .account-form { display: flex; flex-direction: column; gap: 10px; padding: 14px 4px 6px; }
  .account-form input { font-family: inherit; font-size: 14px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); }
  .account-form input:focus { outline: none; border-color: var(--accent); }
  .account-form .row { display: flex; gap: 8px; }
  .account-form .row button { flex: 1; }
  .account-msg { font-size: 12.5px; color: var(--text-soft); line-height: 1.5; }
  .account-msg.err { color: var(--bad); font-weight: 600; }
  .account-whoami { font-size: 13px; padding: 12px 4px 2px; color: var(--text-soft); }
  .account-whoami b { color: var(--text); }

  /* Summary */
  .summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 15px 16px; box-shadow: var(--shadow); }
  .stat .label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-faint); font-weight: 700; margin-bottom: 6px; }
  .stat .value { font-size: 25px; font-weight: 800; letter-spacing: -.02em; }
  .stat .meta { font-size: 12px; color: var(--text-soft); margin-top: 3px; }
  .stat.net.pos .value { color: var(--good); }
  .stat.net.neg .value { color: var(--bad); }
  .stat.accent { background: linear-gradient(160deg, var(--accent), var(--accent-strong)); border-color: transparent; color: #fff; }
  .stat.accent .label, .stat.accent .meta { color: rgba(255,255,255,.85); }

  /* Expiring strip */
  .strip { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 20px; box-shadow: var(--shadow); }
  .strip h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--warn); margin: 0 0 11px; font-weight: 700; display: flex; align-items: center; gap: 7px; }
  .strip .chips { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 3px; }
  .chip { flex: 0 0 auto; min-width: 188px; border: 1px solid var(--border); border-left: 3px solid var(--warn); border-radius: 10px; padding: 9px 11px; background: var(--surface-2); }
  .chip .c-card { font-size: 11px; color: var(--text-faint); font-weight: 600; }
  .chip .c-name { font-size: 13.5px; font-weight: 600; margin: 2px 0 5px; }
  .chip .c-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .chip .c-days { font-size: 12px; font-weight: 700; }
  .days-0 { color: var(--bad); }
  .days-soon { color: var(--warn); }
  .strip.empty h2 { color: var(--good); }
  .strip .none { font-size: 13px; color: var(--text-soft); }

  /* Card sections */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 14px; box-shadow: var(--shadow); overflow: hidden; }
  .card-head { display: flex; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer; user-select: none; }
  .card-head:hover { background: var(--surface-2); }
  .caret { transition: transform .15s; color: var(--text-faint); font-size: 13px; }
  .caret.open { transform: rotate(90deg); }
  .card-title { flex: 1; min-width: 0; }
  .card-title .name { font-size: 16px; font-weight: 700; }
  .card-title .issuer { font-size: 12px; color: var(--text-faint); font-weight: 500; }
  .verdict { text-align: right; }
  .verdict .net { font-size: 16px; font-weight: 800; }
  .verdict .net.pos { color: var(--good); }
  .verdict .net.neg { color: var(--bad); }
  .verdict .tag { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 999px; display: inline-block; margin-top: 3px; }
  .verdict .tag.pos { color: var(--good); background: var(--good-bg); }
  .verdict .tag.neg { color: var(--bad); background: var(--bad-bg); }

  .card-body { border-top: 1px solid var(--border); padding: 6px 16px 14px; }
  .card-sub { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--text-soft); padding: 10px 2px; border-bottom: 1px dashed var(--border); margin-bottom: 6px; }
  .card-sub b { color: var(--text); font-weight: 700; }

  /* Benefit rows */
  .benefit { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; padding: 13px 2px; border-bottom: 1px solid var(--border); }
  .benefit:last-child { border-bottom: none; }
  .b-main { min-width: 0; }
  .b-name { font-size: 14.5px; font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .b-face { color: var(--text-soft); font-weight: 600; }
  .cadence { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--accent-strong); background: var(--accent-soft); padding: 2px 7px; border-radius: 999px; }
  @media (prefers-color-scheme: dark) { .cadence { color: var(--accent-strong); background: var(--accent-soft); } }
  .b-reset { font-size: 12px; color: var(--text-faint); margin-top: 4px; }
  .b-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
  .b-eff { text-align: right; min-width: 84px; }
  .b-eff .e-val { font-size: 14px; font-weight: 700; }
  .b-eff .e-lbl { font-size: 10.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: .04em; font-weight: 700; }

  /* segmented offset/induced */
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg button { border: none; border-radius: 0; padding: 6px 10px; font-size: 12px; background: transparent; color: var(--text-soft); }
  .seg button.on { background: var(--accent); color: #fff; }
  .seg button:hover:not(.on) { background: var(--surface-2); color: var(--text); }

  /* used switch */
  .switch { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600; color: var(--text-soft); cursor: pointer; }
  .track { width: 38px; height: 22px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); position: relative; transition: .15s; }
  .track .knob { position: absolute; top: 1px; left: 1px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: .15s; }
  .switch.on .track { background: var(--good); border-color: var(--good); }
  .switch.on .track .knob { left: 17px; }
  .switch.on { color: var(--good); }

  /* realization slider */
  .slider { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-soft); }
  .slider input[type=range] { width: 96px; accent-color: var(--accent); }
  .slider .pct { font-weight: 700; min-width: 34px; color: var(--text); }

  /* usage units stepper */
  .stepper { display: inline-flex; align-items: center; gap: 6px; }
  .stepper button { padding: 3px 10px; font-size: 15px; line-height: 1; border-radius: 7px; font-weight: 700; }
  .stepper .units { font-size: 12px; font-weight: 700; color: var(--text); min-width: 80px; text-align: center; }

  .b-note { grid-column: 1 / -1; margin-top: 6px; }
  .b-note textarea { width: 100%; resize: vertical; min-height: 30px; font-family: inherit; font-size: 12.5px; color: var(--text-soft); background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 7px 9px; }
  .b-note textarea:focus { outline: none; border-color: var(--accent); }

  .used-flag { font-size: 11px; font-weight: 700; color: var(--good); }
  .auto-flag { font-size: 11px; font-weight: 700; color: var(--accent-strong); }

  /* auto-credit toggle: off = a quiet opt-in beside the Used switch;
     on = it REPLACES the switch, because there is nothing left to do. */
  .auto-btn { padding: 5px 10px; font-size: 11.5px; font-weight: 700; border-radius: 999px; }
  .auto-btn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .auto-btn.on:hover { background: var(--accent-strong); border-color: var(--accent-strong); color: #fff; }
  .use-ctl { display: inline-flex; align-items: center; gap: 8px; }

  /* modal */
  .overlay { position: fixed; inset: 0; background: rgba(15,23,42,.5); display: flex; align-items: flex-start; justify-content: center; padding: 50px 16px; z-index: 50; overflow-y: auto; }
  .modal { background: var(--surface); border-radius: 16px; max-width: 560px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,.3); border: 1px solid var(--border); }
  .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid var(--border); }
  .modal-head h2 { margin: 0; font-size: 17px; font-weight: 700; }
  .modal-body { padding: 8px 18px 18px; max-height: 60vh; overflow-y: auto; }
  .pick { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 4px; border-bottom: 1px solid var(--border); }
  .pick:last-child { border-bottom: none; }
  .pick .p-name { font-weight: 600; font-size: 14.5px; }
  .pick .p-meta { font-size: 12px; color: var(--text-faint); margin-top: 2px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-soft); background: var(--surface); border: 1px dashed var(--border); border-radius: var(--radius); }
  .empty-state h3 { font-size: 18px; color: var(--text); margin: 0 0 6px; }
  .empty-state p { max-width: 440px; margin: 0 auto; }
  .empty-actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }

  footer.app { margin-top: 26px; font-size: 12px; color: var(--text-faint); display: flex; gap: 16px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
  footer.app .tests.ok { color: var(--good); }
  footer.app .tests.fail { color: var(--bad); font-weight: 700; }
  footer.app a { color: var(--accent-strong); cursor: pointer; }

  @media (max-width: 760px) {
    .summary { grid-template-columns: repeat(2, 1fr); }
    .benefit { grid-template-columns: 1fr; }
    .b-eff { text-align: left; }
    .b-controls { justify-content: flex-start; }
    .verdict .net { font-size: 15px; }
  }
</style>
</head>

<div id="root"></div>

<!-- ============================================================= -->
<!-- PURE LOGIC MODULE — no React, no DOM. All value/period math.   -->
<!-- Lift this whole block out to verify or port to a backend.      -->
<!-- ============================================================= -->
<script>
const Engine = (function () {
  const DAY = 86400000;
  const CADENCES = ["monthly", "quarterly", "semiannual", "annual", "multi_year"];

  function midnight(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }

  // How many times per year this benefit's face value recurs.
  function periodsPerYear(cadence, multiYearYears) {
    switch (cadence) {
      case "monthly": return 12;
      case "quarterly": return 4;
      case "semiannual": return 2;
      case "annual": return 1;
      case "multi_year": return 1 / (multiYearYears && multiYearYears > 0 ? multiYearYears : 4);
      default: return 1;
    }
  }

  // The current period for a cadence given "today" (calendar-aligned).
  // Returns { key, start, end } where end is the last day of the period.
  function currentPeriod(cadence, today, multiYearYears) {
    const t = midnight(today);
    const y = t.getFullYear(), m = t.getMonth();
    const pad = (n) => String(n).padStart(2, "0");
    switch (cadence) {
      case "monthly":
        return { key: `${y}-${pad(m + 1)}`, start: new Date(y, m, 1), end: new Date(y, m + 1, 0) };
      case "quarterly": {
        const q = Math.floor(m / 3);
        return { key: `${y}-Q${q + 1}`, start: new Date(y, q * 3, 1), end: new Date(y, q * 3 + 3, 0) };
      }
      case "semiannual": {
        const h = m < 6 ? 0 : 1;
        return { key: `${y}-H${h + 1}`, start: new Date(y, h * 6, 1), end: new Date(y, h * 6 + 6, 0) };
      }
      case "annual":
        return { key: `${y}`, start: new Date(y, 0, 1), end: new Date(y, 11, 31) };
      case "multi_year": {
        const n = multiYearYears && multiYearYears > 0 ? multiYearYears : 4;
        const block = Math.floor(y / n) * n;
        return { key: `MY-${block}-${block + n - 1}`, start: new Date(block, 0, 1), end: new Date(block + n - 1, 11, 31) };
      }
      default:
        return { key: `${y}`, start: new Date(y, 0, 1), end: new Date(y, 11, 31) };
    }
  }

  // Whole days from today until (and including) the last day of the current period.
  function daysToReset(cadence, today, multiYearYears) {
    const { end } = currentPeriod(cadence, today, multiYearYears);
    return Math.round((midnight(end) - midnight(today)) / DAY);
  }

  // Recurring/auto-applied: the credit posts by itself every period (a monthly
  // membership fee that a statement credit cancels out, a streaming credit that
  // lands when the subscription bills). There is no per-period action, so Perq
  // must never ask for one. Usage perks are per-use by definition — the flag is
  // meaningless there, so it's ignored rather than trusted.
  function isAuto(benefit) {
    return !!benefit.auto_credit && benefit.value_type !== "usage";
  }

  // Is the stored "used" flag valid for the period we're in right now?
  // A used flag stamped in a prior period auto-expires (resets to unused).
  // Auto-credits are used by definition — no stamp needed, no expiry.
  function isUsedNow(benefit, today) {
    if (isAuto(benefit)) return true;
    if (!benefit.used) return false;
    const { key } = currentPeriod(benefit.reset_cadence, today, benefit.multi_year_years);
    return benefit.used_period_key === key;
  }

  // How many face-units accrue per year. Offset/induced accrue on a calendar
  // period (monthly=12, …); USAGE benefits accrue once per expected use (a
  // lounge visit, a hotel night) — value scales with how often you travel, not
  // with the calendar.
  function annualUnits(b) {
    if (b.value_type === "usage") return Math.max(0, num(b.expected_units));
    return periodsPerYear(b.reset_cadence, b.multi_year_years);
  }

  // Annualized face value (nominal) of one benefit = per-unit face × units/yr.
  function annualNominal(b) {
    return num(b.face_value) * annualUnits(b);
  }

  // Annualized effective value: offset counts at full face; induced and usage
  // are discounted by their realization rate (the share of sticker value you
  // actually capture).
  function annualEffective(b) {
    const nominal = annualNominal(b);
    if (b.value_type === "offset") return nominal;
    return nominal * (clampRate(b.realization_rate) / 100);
  }

  // Totals for a held card (its fee + its benefits).
  function cardTotals(card, benefits) {
    let nominal = 0, effective = 0;
    for (const b of benefits) { nominal += annualNominal(b); effective += annualEffective(b); }
    const fee = num(card.annual_fee);
    return { nominal, effective, fee, net: effective - fee };
  }

  // Portfolio totals across all held cards.
  function portfolioTotals(cards, benefitsByCard) {
    let nominal = 0, effective = 0, fees = 0;
    for (const c of cards) {
      const t = cardTotals(c, benefitsByCard[c.id] || []);
      nominal += t.nominal; effective += t.effective; fees += t.fee;
    }
    return { nominal, effective, fees, net: effective - fees };
  }

  // Expiring soon: unused AND within `windowDays` of the period reset.
  // Usage benefits (lounges, status, per-stay perks) have no use-by date, so
  // they never expire.
  function isExpiringSoon(benefit, today, windowDays) {
    const w = windowDays == null ? 14 : windowDays;
    if (benefit.value_type === "usage") return false;
    if (isUsedNow(benefit, today)) return false;
    const d = daysToReset(benefit.reset_cadence, today, benefit.multi_year_years);
    return d >= 0 && d < w;
  }

  function num(v) { const n = parseFloat(v); return isFinite(n) ? n : 0; }
  function clampRate(r) { const n = num(r); return Math.max(0, Math.min(100, n)); }

  return {
    DAY, CADENCES, midnight, periodsPerYear, annualUnits, currentPeriod, daysToReset,
    isAuto, isUsedNow, annualNominal, annualEffective, cardTotals, portfolioTotals,
    isExpiringSoon, num, clampRate,
  };
})();

// ---- Self-tests (cheap correctness gate; result shown in footer) ----
function runEngineSelfTests() {
  const results = [];
  const ok = (name, cond) => results.push({ name, pass: !!cond });
  const approx = (a, b) => Math.abs(a - b) < 1e-9;
  const D = (y, m, d) => new Date(y, m - 1, d);

  ok("periodsPerYear monthly=12", Engine.periodsPerYear("monthly") === 12);
  ok("periodsPerYear quarterly=4", Engine.periodsPerYear("quarterly") === 4);
  ok("periodsPerYear semiannual=2", Engine.periodsPerYear("semiannual") === 2);
  ok("periodsPerYear annual=1", Engine.periodsPerYear("annual") === 1);
  ok("periodsPerYear multi_year(4)=0.25", approx(Engine.periodsPerYear("multi_year", 4), 0.25));

  ok("annualNominal monthly $25 = 300", approx(Engine.annualNominal({ face_value: 25, reset_cadence: "monthly" }), 300));
  ok("annualNominal multi_year $120/4 = 30", approx(Engine.annualNominal({ face_value: 120, reset_cadence: "multi_year", multi_year_years: 4 }), 30));
  ok("offset effective = nominal", approx(Engine.annualEffective({ face_value: 200, reset_cadence: "annual", value_type: "offset" }), 200));
  ok("induced effective = nominal*rate", approx(Engine.annualEffective({ face_value: 680, reset_cadence: "annual", value_type: "induced", realization_rate: 65 }), 442));
  ok("induced rate clamps >100", approx(Engine.annualEffective({ face_value: 100, reset_cadence: "annual", value_type: "induced", realization_rate: 150 }), 100));

  ok("usage nominal = face × units", approx(Engine.annualNominal({ face_value: 50, value_type: "usage", expected_units: 12 }), 600));
  ok("usage effective = nominal × rate", approx(Engine.annualEffective({ face_value: 50, value_type: "usage", expected_units: 12, realization_rate: 45 }), 270));
  ok("usage zero units = 0", approx(Engine.annualNominal({ face_value: 50, value_type: "usage", expected_units: 0 }), 0));

  // period keys at a fixed date: May 31, 2026
  const may31 = D(2026, 5, 31);
  ok("monthly key 2026-05", Engine.currentPeriod("monthly", may31).key === "2026-05");
  ok("quarterly key 2026-Q2", Engine.currentPeriod("quarterly", may31).key === "2026-Q2");
  ok("semiannual key 2026-H1", Engine.currentPeriod("semiannual", may31).key === "2026-H1");
  ok("annual key 2026", Engine.currentPeriod("annual", may31).key === "2026");
  ok("multi_year(4) key block 2024-2027", Engine.currentPeriod("multi_year", may31, 4).key === "MY-2024-2027");

  // daysToReset: from May 31 to end of May = 0; to end of year = 214
  ok("daysToReset monthly end-of-month = 0", Engine.daysToReset("monthly", may31) === 0);
  ok("daysToReset annual May31->Dec31 = 214", Engine.daysToReset("annual", may31) === 214);

  // used-now auto-expiry
  const b = { used: true, used_period_key: "2026-04", reset_cadence: "monthly" };
  ok("used flag from prior period expires", Engine.isUsedNow(b, may31) === false);
  ok("used flag for current period holds", Engine.isUsedNow({ used: true, used_period_key: "2026-05", reset_cadence: "monthly" }, may31) === true);

  // expiring soon: unused monthly on May 31 -> 0 days -> expiring
  ok("unused monthly at month-end is expiring", Engine.isExpiringSoon({ used: false, reset_cadence: "monthly" }, may31) === true);
  ok("used benefit is never expiring", Engine.isExpiringSoon({ used: true, used_period_key: "2026-05", reset_cadence: "monthly" }, may31) === false);
  ok("annual benefit mid-year not expiring", Engine.isExpiringSoon({ used: false, reset_cadence: "annual" }, may31) === false);
  ok("usage benefit never expiring", Engine.isExpiringSoon({ value_type: "usage", expected_units: 5, reset_cadence: "annual" }, may31) === false);

  // ---- auto-credits: recurring perks that post by themselves ----
  // The whole point: never nag, in any period, with no stamp to maintain.
  const autoB = { auto_credit: true, used: false, used_period_key: null, reset_cadence: "monthly", value_type: "offset" };
  ok("auto credit reads as used with no stamp", Engine.isUsedNow(autoB, may31) === true);
  ok("auto credit still used in a later period", Engine.isUsedNow(autoB, D(2027, 3, 9)) === true);
  ok("auto credit never expires", Engine.isExpiringSoon(autoB, may31) === false);
  ok("auto flag ignored on usage perks", Engine.isAuto({ auto_credit: true, value_type: "usage" }) === false);
  ok("no auto flag = unchanged manual behaviour", Engine.isUsedNow({ auto_credit: false, used: false, reset_cadence: "monthly" }, may31) === false);
  ok("auto credit is worth exactly what it was worth", approx(
    Engine.annualEffective({ ...autoB, face_value: 12.95, realization_rate: 50 }),
    Engine.annualEffective({ ...autoB, auto_credit: false, face_value: 12.95, realization_rate: 50 })));

  // card totals & net
  const card = { annual_fee: 650 };
  const bens = [
    { face_value: 25, reset_cadence: "monthly", value_type: "offset" },      // 300
    { face_value: 680, reset_cadence: "annual", value_type: "induced", realization_rate: 65 }, // 442
    { face_value: 120, reset_cadence: "multi_year", multi_year_years: 4, value_type: "offset" }, // 30
  ];
  const ct = Engine.cardTotals(card, bens);
  ok("cardTotals nominal = 1010", approx(ct.nominal, 25 * 12 + 680 + 30));
  ok("cardTotals effective = 772", approx(ct.effective, 300 + 442 + 30));
  ok("cardTotals net = 122", approx(ct.net, 772 - 650));

  // ---- Seed-data integrity: recompute every seed card straight from SEED and
  // assert structural invariants. No magic-number oracle, so it survives seed
  // edits, and it exercises offset / induced / usage rows as they ship. ----
  if (typeof SEED !== "undefined") {
    for (const cat of SEED.catalog) {
      const rows = SEED.catalog_benefits.filter(b => b.card_catalog_id === cat.id).map(b => ({
        face_value: b.face_value, reset_cadence: b.reset_cadence, multi_year_years: b.multi_year_years,
        value_type: b.default_value_type, realization_rate: b.default_realization_rate,
        expected_units: b.expected_units,
      }));
      let nom = 0, eff = 0;
      for (const b of rows) { nom += Engine.annualNominal(b); eff += Engine.annualEffective(b); }
      ok(`seed ${cat.id} has benefits`, rows.length > 0);
      ok(`seed ${cat.id} totals finite`, isFinite(nom) && isFinite(eff));
      ok(`seed ${cat.id} effective <= nominal`, eff <= nom + 1e-9);
      ok(`seed ${cat.id} effective > 0`, eff > 0);
    }

    // ---- reconcileHeldBenefits: a held card missing newer catalog benefits
    // gets them back-filled on load, without disturbing existing tuned rows. ----
    if (typeof reconcileHeldBenefits === "function" && typeof syncSeedCatalog === "function") {
      const cat0 = SEED.catalog[0];
      const full = SEED.catalog_benefits.filter(b => b.card_catalog_id === cat0.id);
      // Simulate a stale card holding only its FIRST benefit, with a custom note.
      const stale = {
        schema_version: 1, catalog: [], catalog_benefits: [],
        held_cards: [{ id: "hc_test", card_catalog_id: cat0.id, name: cat0.name, annual_fee: cat0.annual_fee }],
        held_benefits: [{
          id: "hb_test", held_card_id: "hc_test", catalog_benefit_id: full[0].id,
          name: full[0].name, face_value: full[0].face_value, reset_cadence: full[0].reset_cadence,
          value_type: full[0].default_value_type, realization_rate: 33, note: "MY TUNING", used: false,
        }],
      };
      const fixed = reconcileHeldBenefits(syncSeedCatalog(stale));
      const fixedRows = fixed.held_benefits.filter(b => b.held_card_id === "hc_test");
      ok("reconcile back-fills missing benefits", fixedRows.length === full.length);
      ok("reconcile reports added count", fixed._reconciled_added === full.length - 1);
      const kept = fixedRows.find(b => b.id === "hb_test");
      ok("reconcile preserves existing tuning", kept && kept.realization_rate === 33 && kept.note === "MY TUNING");
      const noDupes = new Set(fixedRows.map(b => b.catalog_benefit_id)).size === fixedRows.length;
      ok("reconcile creates no duplicates", noDupes);
      // Idempotent: a second pass adds nothing.
      const again = reconcileHeldBenefits(fixed);
      ok("reconcile is idempotent", again._reconciled_added === 0);

      // Back-filled rows inherit the catalog's auto default, so a card added
      // today already knows which of its credits post by themselves.
      const walmart = fixedRows.find(r => r.catalog_benefit_id === "cb_amex_platinum_8");
      const airline = fixedRows.find(r => r.catalog_benefit_id === "cb_amex_platinum_3");
      ok("back-filled auto credit is flagged", !!walmart && walmart.auto_credit === true);
      ok("back-filled manual credit is not flagged", !!airline && airline.auto_credit === false);
    }

    // ---- One-time seed of auto flags onto benefits held from before the
    // feature existed. Must catch the recurring ones, leave everything else
    // alone, and never re-flip a credit the user set back to manual. ----
    if (typeof applyAutoCreditDefaults === "function" && typeof syncSeedCatalog === "function") {
      const legacy = syncSeedCatalog({
        schema_version: 1, catalog: [], catalog_benefits: [],
        held_cards: [{ id: "hc_old", card_catalog_id: "amex_platinum", name: "Amex Platinum", annual_fee: 895 }],
        held_benefits: [
          { id: "old_walmart", held_card_id: "hc_old", catalog_benefit_id: "cb_amex_platinum_8", reset_cadence: "monthly", value_type: "induced", used: false },
          { id: "old_airline", held_card_id: "hc_old", catalog_benefit_id: "cb_amex_platinum_3", reset_cadence: "annual", value_type: "offset", used: false },
          { id: "old_optout", held_card_id: "hc_old", catalog_benefit_id: "cb_amex_platinum_6", reset_cadence: "monthly", value_type: "offset", used: false, auto_credit: false },
        ],
      });
      const seeded = applyAutoCreditDefaults(legacy);
      const row = (id) => seeded.held_benefits.find(x => x.id === id);
      ok("seed flags a recurring credit", row("old_walmart").auto_credit === true);
      ok("seed leaves a manual credit alone", !row("old_airline").auto_credit);
      ok("seed never overrides an explicit opt-out", row("old_optout").auto_credit === false);
      ok("seed reports how many it touched", seeded._auto_seeded === 1);
      ok("seed is idempotent", applyAutoCreditDefaults(seeded)._auto_seeded === 0);
    }

    // ---- The Oct-2026 DoorDash change: one blended $25 row becomes the $15
    // restaurant credit, and the two $10 promos arrive as their own per-use
    // row. Asserted against the catalog template, not against magic numbers,
    // so the next amount change only has to be made in SEED. ----
    if (typeof retuneDoorDash2026 === "function" && typeof syncSeedCatalog === "function") {
      const legacy = syncSeedCatalog({
        schema_version: 2, catalog: [], catalog_benefits: [],
        held_cards: [{ id: "hc_csr", card_catalog_id: "csr", name: "Chase Sapphire Reserve", annual_fee: 795 }],
        held_benefits: [
          { id: "old_dd", held_card_id: "hc_csr", catalog_benefit_id: "cb_csr_7", name: "DoorDash Promo Credits", face_value: 25, reset_cadence: "monthly", value_type: "induced", realization_rate: 36, note: DOORDASH_OLD_NOTE, used: true, used_period_key: "2026-07" },
          { id: "old_dp", held_card_id: "hc_csr", catalog_benefit_id: "cb_csr_8", name: "DashPass Membership", face_value: 120, reset_cadence: "annual", value_type: "offset", realization_rate: 17, note: "mine", used: true, used_period_key: "2026" },
        ],
      });
      const moved = retuneDoorDash2026(reconcileHeldBenefits(legacy));
      const tpl = (id) => moved.catalog_benefits.find(x => x.id === id);
      const row = (id) => moved.held_benefits.find(x => x.catalog_benefit_id === id);
      ok("DoorDash row takes the catalog's new face value", row("cb_csr_7").face_value === tpl("cb_csr_7").face_value);
      ok("DoorDash row drops the rate tuned against the old blob", row("cb_csr_7").realization_rate === tpl("cb_csr_7").default_realization_rate);
      ok("DoorDash retune keeps the used stamp", row("cb_csr_7").used === true && row("cb_csr_7").used_period_key === "2026-07");
      ok("DoorDash retune reports one row", moved._doordash_retuned === 1);
      ok("DoorDash retune is idempotent", retuneDoorDash2026(moved)._doordash_retuned === 0);
      ok("the $10 promos land as a per-use row", !!row("cb_csr_12") && row("cb_csr_12").value_type === "usage"
        && row("cb_csr_12").expected_units === tpl("cb_csr_12").expected_units);
      ok("DoorDash retune replaces only the stale catalog note", row("cb_csr_7").note === tpl("cb_csr_7").default_note);
      // 17 is a value no template carries, so this can't pass by coincidence
      ok("DoorDash retune leaves the card's other rows alone", row("cb_csr_8").realization_rate === 17 && row("cb_csr_8").note === "mine");
      // anything the user re-typed no longer looks like the old blended row — hands off
      const edited = (patch) => retuneDoorDash2026({
        catalog_benefits: moved.catalog_benefits,
        held_benefits: [Object.assign({ catalog_benefit_id: "cb_csr_7", face_value: 25, reset_cadence: "monthly", value_type: "induced", realization_rate: 10 }, patch)],
      });
      ok("DoorDash retune skips a hand-set face value", edited({ face_value: 20 })._doordash_retuned === 0);
      ok("DoorDash retune skips a row switched to per-use", edited({ value_type: "usage", expected_units: 4 })._doordash_retuned === 0);
      ok("DoorDash retune skips a row on another cadence", edited({ reset_cadence: "annual" })._doordash_retuned === 0);
      ok("DoorDash retune keeps a note the user wrote", edited({ note: "my own note" }).held_benefits[0].note === "my own note");
      ok("DoorDash retune tolerates a db with no held rows", retuneDoorDash2026({ catalog_benefits: moved.catalog_benefits })._doordash_retuned === 0);
    }
  }

  // ---- CloudSync: row mapping is the cloud-schema contract; syncDecision is
  // the entire merge policy. Both are pure — test them without a network. ----
  if (typeof CloudSync !== "undefined") {
    const stamp = "2026-06-12T00:00:00.000Z";
    const db1 = {
      held_cards: [{ id: "hc1", card_catalog_id: "amex_platinum", name: "Amex Platinum", issuer: "American Express", network: "Amex", nickname: null, annual_fee: 895, added_at: "2026-05-31T00:00:00.000Z", _junk: true }],
      held_benefits: [
        { id: "hb1", held_card_id: "hc1", catalog_benefit_id: "cb_amex_platinum_1", name: "Hotel Credit", face_value: 300, reset_cadence: "semiannual", multi_year_years: null, value_type: "offset", realization_rate: 80, unit_label: null, expected_units: null, note: "tuned", used: true, used_period_key: "2026-H1", sort_order: 1, _junk: true },
        { id: "hb2", held_card_id: "hc1", catalog_benefit_id: "cb_amex_platinum_8", name: "Walmart+", face_value: 12.95, reset_cadence: "monthly", multi_year_years: null, value_type: "induced", realization_rate: 50, unit_label: null, expected_units: null, note: "", used: false, used_period_key: null, auto_credit: true, sort_order: 8 },
      ],
    };
    const rows = CloudSync.rowsFromDb(db1, "user-1", stamp);
    ok("cloud rows: card mapped with user + stamp", rows.cards.length === 1 && rows.cards[0].user_id === "user-1" && rows.cards[0].updated_at === stamp && rows.cards[0].annual_fee === 895);
    ok("cloud rows: stray local fields stripped", !("_junk" in rows.cards[0]) && !("_junk" in rows.benefits[0]));
    ok("cloud rows: benefit tuning survives mapping", rows.benefits[0].realization_rate === 80 && rows.benefits[0].used === true && rows.benefits[0].used_period_key === "2026-H1" && rows.benefits[0].note === "tuned");
    const back = CloudSync.dbFromRows(rows.cards, rows.benefits, 1);
    ok("cloud round-trip: held shapes restored", back.held_cards[0].id === "hc1" && !("user_id" in back.held_cards[0]) && back.held_benefits[0].note === "tuned" && back.held_benefits[0].used === true);
    // An auto flag that didn't survive the round-trip would silently start
    // nagging again on every other device.
    ok("cloud rows: auto flag mapped both ways", rows.benefits[1].auto_credit === true && back.held_benefits[1].auto_credit === true);
    ok("cloud rows: manual credit stays manual", rows.benefits[0].auto_credit === false && back.held_benefits[0].auto_credit === false);
    ok("cloud round-trip: all four tables present", Array.isArray(back.catalog) && Array.isArray(back.catalog_benefits) && back.schema_version === 1);

    const dec = CloudSync.syncDecision;
    ok("sync: empty cloud → push", dec({ cloudStamp: null, everSynced: false, localDirty: true }) === "push");
    ok("sync: fresh device, cloud data, untouched local → pull", dec({ cloudStamp: "A", everSynced: false, localDirty: false }) === "pull");
    ok("sync: fresh device, cloud data, edited local → ask", dec({ cloudStamp: "A", everSynced: false, localDirty: true }) === "first-sync-conflict");
    ok("sync: cloud moved, local clean → pull", dec({ cloudStamp: "B", knownCloudStamp: "A", everSynced: true, localDirty: false }) === "pull");
    ok("sync: cloud same, local dirty → push", dec({ cloudStamp: "A", knownCloudStamp: "A", everSynced: true, localDirty: true }) === "push");
    ok("sync: in sync → none", dec({ cloudStamp: "A", knownCloudStamp: "A", everSynced: true, localDirty: false }) === "none");
    ok("sync: both moved, cloud newer → pull", dec({ cloudStamp: "2026-06-12T02:00:00Z", knownCloudStamp: "2026-06-12T00:00:00Z", everSynced: true, localDirty: true, localChangedAt: "2026-06-12T01:00:00Z" }) === "pull");
    ok("sync: both moved, local newer → push", dec({ cloudStamp: "2026-06-12T01:00:00Z", knownCloudStamp: "2026-06-12T00:00:00Z", everSynced: true, localDirty: true, localChangedAt: "2026-06-12T02:00:00Z" }) === "push");
  }

  const passed = results.filter(r => r.pass).length;
  const failed = results.filter(r => !r.pass);
  if (failed.length) console.error("[Perq] engine self-tests FAILED:", JSON.stringify(failed.map(f => f.name)));
  else console.log(`[Perq] engine self-tests passed: ${passed}/${results.length}`);
  return { passed, total: results.length, failed };
}
</script>

  // errand, nothing to remember. Those ship pre-flagged so they never nag.

  // to make* (Uber Cash, Lyft, DoorDash) still needs you to go spend it.
  const cb = (card_catalog_id, sort, name, face_value, reset_cadence, value_type, realization_rate, note, multi_year_years, auto) => ({
    id: `cb_${card_catalog_id}_${sort}`,

    default_auto_credit: !!auto,
    multi_year_years: multi_year_years || null,
    unit_label: null, expected_units: null,

  // Usage benefit: value scales per use, not per calendar period. face_value is
  // the per-unit sticker; realization_rate is the share of that you'd actually
  // pay for; expected_units is how many you get per year.
  const cu = (card_catalog_id, sort, name, value_per_unit, unit_label, expected_units, realization_rate, note) => ({

  const catalog = [

  const catalog_benefits = [
    // ---- Amex Platinum ($895) — 2026 post-refresh ----

    cb("amex_platinum", 5, "Uber One Membership", 120, "annual", "induced", 50, "Covers Uber One membership up to $120/yr."),
    cb("amex_platinum", 6, "Digital Entertainment Credit", 25, "monthly", "offset", 70, "Disney+, Hulu, ESPN+, Peacock, Paramount+, NYT, WSJ, YouTube Premium/TV. Enrollment; monthly use-or-lose. Auto: the credit posts when the enrolled subscription bills.", null, true),
    cb("amex_platinum", 7, "CLEAR Plus Credit", 219, "annual", "offset", 60, "Covers CLEAR Plus membership ($219/yr — price and credit both raised 7/1/2026)."),
    cb("amex_platinum", 8, "Walmart+ Membership", 12.95, "monthly", "induced", 50, "Covers the monthly Walmart+ plan only (not annual); pay with Platinum. Auto: the plan charges and the credit posts every month on its own.", null, true),
    cb("amex_platinum", 9, "Equinox Credit", 300, "annual", "induced", 40, "Annual $300 on Equinox club or Equinox+/App; enrollment + auto-renew."),
    cb("amex_platinum", 10, "lululemon Credit", 75, "quarterly", "induced", 60, "U.S. lululemon stores (excl. outlets) or lululemon.com; quarterly use-or-lose."),
    cb("amex_platinum", 11, "Oura Ring Credit", 200, "annual", "induced", 25, "Up to $200 on an Oura Ring purchase (hardware only)."),
    cb("amex_platinum", 12, "Global Entry / TSA PreCheck", 120, "multi_year", "offset", 100, "App-fee reimbursement: $120 Global Entry or up to $85 TSA PreCheck, once every 4 years.", 4),
    cu("amex_platinum", 13, "Lounge Access (Centurion + Priority Pass)", 50, "visit", 12, 45, "Centurion Lounges + Priority Pass + Delta SkyClub (when flying Delta). Set visits/yr and what a visit is genuinely worth to you — usually well under the ~$50 day-pass sticker."),
    cu("amex_platinum", 14, "FHR / THC Stay Perks", 150, "stay", 2, 75, "On-property Fine Hotels + Resorts perks ON TOP OF the credit: free breakfast for two, ~$100 experience credit, room upgrade, late checkout. Per qualifying stay."),
    // Note: Saks credit omitted — Amex is ending it July 1, 2026 (Saks bankruptcy); replacement TBD.

    // ---- Chase Sapphire Reserve ($795) — 2026 post-refresh ----
    cb("csr", 1, "Annual Travel Credit", 300, "annual", "offset", 100, "Auto-applied to first travel purchases each cardmember year; broad travel definition. No activation."),
    cb("csr", 2, "The Edit Hotel Credit", 500, "annual", "offset", 70, "Up to $500/yr (max $250 per booking) on prepaid 2+ night stays at The Edit via Chase Travel. 2026 change: fully flexible — the old Jan–Jun / Jul–Dec windows are gone."),
    cb("csr", 3, "Dining Credit (Exclusive Tables)", 150, "semiannual", "offset", 80, "Up to $150 per half-year (Jan–Jun / Jul–Dec) at Sapphire Reserve Exclusive Tables. No rollover."),
    cb("csr", 4, "StubHub / viagogo Credit", 150, "semiannual", "induced", 50, "Up to $150 per half-year on StubHub/viagogo event tickets; activation required."),
    cb("csr", 5, "Apple TV+ & Apple Music", 250, "annual", "induced", 60, "Complimentary Apple TV+ & Music (~$250/yr value); activate each service; through 6/22/2027."),
    cb("csr", 6, "Lyft Credit", 10, "monthly", "offset", 90, "$10 in-app Lyft credit each month; activation required; forfeits monthly."),
    cb("csr", 7, "DoorDash Restaurant Credit", 15, "monthly", "induced", 80, "$15/mo in DoorDash restaurant promos — tripled from $5 on 10/1/2026, runs through 2029. Requires active DashPass; forfeits monthly."),
    cb("csr", 8, "DashPass Membership", 120, "annual", "induced", 50, "Complimentary DashPass ($0 delivery fees); activate by 12/31/2027. Enables the monthly promos."),
    cb("csr", 9, "Peloton Credit", 10, "monthly", "induced", 50, "$10/mo on a Peloton membership; through 12/31/2027."),
    cb("csr", 10, "Global Entry / TSA / NEXUS", 120, "multi_year", "offset", 100, "Application-fee reimbursement once every 4 years.", 4),

      id: r.id, card_catalog_id: r.card_catalog_id, name: r.name, issuer: r.issuer,
      network: r.network, nickname: r.nickname, annual_fee: r.annual_fee, added_at: r.added_at,

      id: r.id, held_card_id: r.held_card_id, catalog_benefit_id: r.catalog_benefit_id,
      name: r.name, face_value: r.face_value, reset_cadence: r.reset_cadence,

  //   cloudStamp       sync_meta.updated_at in the cloud (null = cloud empty)
  //   knownCloudStamp  the cloud stamp this device last saw (null = never synced here)

  // cloud already has data — the one case where silently picking a side could
  // destroy real data, so the UI must ask.
  function syncDecision(s) {

// local/file:// builds keep the seeded default below.

function uuid() {

// Instantiate one catalog template into a held card + its held benefits.
// Held benefits COPY the template's values at add-time so later catalog
// corrections never silently overwrite the user's tuned tracking.
// Shared by addCard (live catalog) and the default seed (SEED catalog).
function heldBenefitFromTemplate(cardId, t) {
  return {
    id: uuid(), held_card_id: cardId, catalog_benefit_id: t.id,
    name: t.name, face_value: t.face_value, reset_cadence: t.reset_cadence,
    multi_year_years: t.multi_year_years || null,
    value_type: t.default_value_type, realization_rate: t.default_realization_rate,
    unit_label: t.unit_label || null, expected_units: (t.expected_units != null ? t.expected_units : null),
    note: t.default_note || "", used: false, used_period_key: null,
    auto_credit: !!t.default_auto_credit, sort_order: t.sort_order,
  };
}

function instantiateCard(cat, catalogBenefits) {
  const cardId = uuid();
  const card = {
    id: cardId, card_catalog_id: cat.id, name: cat.name, issuer: cat.issuer,
    network: cat.network, nickname: null, annual_fee: cat.annual_fee, added_at: new Date().toISOString(),

}

// Forward-fill: when the catalog gains a benefit AFTER a card is already held
// (e.g. the lounge / status usage rows added in a later version), add the

// benefits the user already has — and any tuning on them — are left untouched.
// Returns the count added so the UI can flag what changed.
function reconcileHeldBenefits(db) {
  let added = 0;
  for (const card of db.held_cards) {
    const have = new Set(
      db.held_benefits
        .filter(b => b.held_card_id === card.id)
        .map(b => b.catalog_benefit_id)
        .filter(Boolean)
    );
    const templates = db.catalog_benefits.filter(t => t.card_catalog_id === card.card_catalog_id);
    for (const t of templates) {
      if (have.has(t.id)) continue;
      db.held_benefits.push(heldBenefitFromTemplate(card.id, t));
      added++;
    }
  }
  db._reconciled_added = added;
  return db;
}

// cards pre-instantiated as held, so the app opens to a populated dashboard
// that can be tuned immediately rather than an empty screen. Shell builds
// (PERQ_SHELL) start with no held cards: sign in, import a backup, or add
// from the catalog. Removing a card and reloading will NOT re-add it (held
// state persists in localStorage); only an explicit "Reset to seed" returns
// to this default.
function freshDbFromSeed() {
  const db = {
    schema_version: SCHEMA_VERSION,
    catalog: SEED.catalog.map(c => ({ ...c })),
    catalog_benefits: SEED.catalog_benefits.map(b => ({ ...b })),
    held_cards: [],
    held_benefits: [],
  };
  if (!PERQ_SHELL) {
    for (const cat of SEED.catalog) {
      const { card, benefits } = instantiateCard(cat, SEED.catalog_benefits);
      db.held_cards.push(card);
      db.held_benefits.push(...benefits);
    }
  }
  return db;
}

// flag at all, so seed it from the catalog default (Walmart+, streaming, the
// monthly dining credit) instead of making the user find them by hand.
//
// Gated on a device-local marker rather than db.schema_version, because a
// device can also ADOPT its whole state from the cloud — and cloud rows carry
// no version of their own, so a phone that pulled first would never get seeded.
// Because it runs exactly once, switching a credit back to manual sticks.
const MIGRATION_KEY = "perq.migrations.v1";

}

  try {

// Pure, so the self-tests can exercise it without touching the real marker.

  const autoTemplates = new Set(
    (db.catalog_benefits || []).filter(t => t.default_auto_credit).map(t => t.id)

  let seeded = 0;
  for (const b of db.held_benefits) {
    if (b.auto_credit == null && autoTemplates.has(b.catalog_benefit_id)) {
      b.auto_credit = true; seeded++;

function seedAutoCredits(db) {
  if (migrationDone("auto_credit_seed")) return db;

// ---- Oct 1, 2026: the CSR DoorDash credit changed shape ----------------
// Chase tripled the monthly restaurant promo ($5 -> $15) and left the two $10
// non-restaurant promos alone. The old catalog carried all three as a single
// $25/mo row, which can no longer be tuned honestly: the restaurant half gets
// used most months, the $10s once or twice a year. So cb_csr_7 narrows to the
// restaurant credit and cb_csr_12 — back-filled by reconcileHeldBenefits —
// carries the $10s as a per-redemption row.
//
// Held rows normally keep whatever they copied at add-time, but this benefit
// changed underneath them: a realization rate tuned against "all DoorDash
// promos" says nothing about a restaurants-only credit, so the row IS
// re-pointed at the catalog template — rate included. That is the one
// deliberate overwrite here, and the guard is what bounds it: only a row still
// in the old blended shape ($25, monthly, induced) is touched, so a row the
// user has re-typed — different amount, different cadence, switched to a
// per-use row — is left exactly as it is. What survives on a row that does
// get retuned: its used stamp, and any note the user wrote themselves (only
// the stale catalog text is replaced). A rewritten row can never match the
// guard again, so this is idempotent and needs no run-once marker — a stale
// backup imported next year gets corrected too.
const DOORDASH_OLD_NOTE = "Monthly $5 restaurant + two $10 non-restaurant promos; requires active DashPass; forfeits monthly.";

function retuneDoorDash2026(db) {
  const t = (db.catalog_benefits || []).find(x => x.id === "cb_csr_7");
  let retuned = 0;
  if (t && Engine.num(t.face_value) !== 25) {
    for (const b of (db.held_benefits || [])) {
      if (b.catalog_benefit_id !== "cb_csr_7") continue;
      // still the old blended row, untouched in shape: $25 a month, induced.
      if (Engine.num(b.face_value) !== 25) continue;
      if (b.reset_cadence !== "monthly" || b.value_type !== "induced") continue;
      b.name = t.name;
      b.face_value = t.face_value;
      b.realization_rate = t.default_realization_rate;
      b.unit_label = t.unit_label || null;
      b.expected_units = t.expected_units == null ? null : t.expected_units;
      // a note the user wrote is theirs; only the stale catalog text is replaced
      if (!b.note || b.note === DOORDASH_OLD_NOTE) b.note = t.default_note;
      retuned++;
    }
  }
  db._doordash_retuned = retuned;
  return db;
}

// On every load/import we re-sync catalog templates from SEED so corrections
// (a fixed issuer, a changed credit amount, a new benefit) always reach the
// user. Held cards/benefits copied their values at add-time, so the user's
// actual tracking data is never touched by this sync.
function syncSeedCatalog(db) {
  db.catalog = SEED.catalog.map(c => ({ ...c }));
  db.catalog_benefits = SEED.catalog_benefits.map(b => ({ ...b }));
  return db;
}

function loadDb() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return freshDbFromSeed();
    const parsed = JSON.parse(raw);
    if (!parsed || !Array.isArray(parsed.held_cards)) return freshDbFromSeed();
    // ensure all four tables exist
    parsed.catalog = parsed.catalog || [];
    parsed.catalog_benefits = parsed.catalog_benefits || [];
    parsed.held_cards = parsed.held_cards || [];
    parsed.held_benefits = parsed.held_benefits || [];
    parsed.schema_version = SCHEMA_VERSION;
    return retuneDoorDash2026(seedAutoCredits(reconcileHeldBenefits(syncSeedCatalog(parsed))));
  } catch (e) {
    console.error("[Perq] load failed, starting fresh:", e);
    return freshDbFromSeed();
  }
}

function saveDb(db) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); }
  catch (e) { console.error("[Perq] save failed:", e); }

// Browsers can't silently write to disk from a double-clicked HTML file — that's
// a hard sandbox rule. The File System Access API is the one sanctioned path:
// the user picks a file ONCE (a real click / permission grant), and from then on
// the app writes to that exact file with no further dialogs. Chrome/Edge only;
// Safari/Firefox fall back to the manual Export button. The chosen file's handle

const FSA_SUPPORTED = typeof window !== "undefined" && typeof window.showSaveFilePicker === "function";
const IDB_NAME = "perq-fs", IDB_STORE = "handles", IDB_KEY = "autosave";

      req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE);

  });

  try {

      tx.objectStore(IDB_STORE).put(handle, IDB_KEY);

  try {

  try {
    const db = await idbOpen();
    await new Promise((res) => {
      const tx = db.transaction(IDB_STORE, "readwrite");

      tx.oncomplete = res; tx.onerror = res;

function serializeDb(db) {
  return JSON.stringify({ ...db, meta: { app: "perq", exported_at: new Date().toISOString() } }, null, 2);
}

// ---------- cloud sync bookkeeping ----------
// Per-device sync state: when this device last changed data, when it last
// synced, and the cloud stamp it last saw. Drives CloudSync.syncDecision.
const SYNC_KEY = "perq.sync.v1";
function loadSyncState() {
  try { return JSON.parse(localStorage.getItem(SYNC_KEY)) || {}; } catch (e) { return {}; }

  try { localStorage.setItem(SYNC_KEY, JSON.stringify(s)); } catch (e) { /* best-effort */ }

// PostgREST `in` list for text ids (ids are uuid / base36 — no quoting hazards).

  await writable.close();

// ---------- formatting ----------
const money = (n, dec = 0) =>
  "$" + (Math.round(n * (dec ? 100 : 1)) / (dec ? 100 : 1)).toLocaleString("en-US",
    { minimumFractionDigits: dec, maximumFractionDigits: dec });

const CADENCE_LABEL = { monthly: "monthly", quarterly: "quarterly", semiannual: "semi-annual", annual: "annual", multi_year: "multi-year" };

function resetLabel(b, today) {
  const d = Engine.daysToReset(b.reset_cadence, today, b.multi_year_years);
  if (b.reset_cadence === "multi_year") {
    const yrs = (d / 365);
    return yrs >= 1 ? `resets in ~${Math.round(yrs * 10) / 10} yr` : `resets in ${d} d`;
  }
  if (d === 0) return "resets today";
  if (d === 1) return "resets tomorrow";
  return `resets in ${d} days`;
}

// ---------- small UI atoms ----------
function Switch({ on, onChange, label }) {

    <div className={"switch" + (on ? " on" : "")} onClick={onChange} role="switch" aria-checked={on}>

// ---------- benefit row ----------
// When the user switches a benefit's value type, seed the fields the new type

    if (!b.unit_label) patch.unit_label = "use";
    if (b.realization_rate == null) patch.realization_rate = 100;

function BenefitRow({ b, today, onPatch }) {
  const isUsage = b.value_type === "usage";
  const auto = Engine.isAuto(b);
  const usedNow = !isUsage && Engine.isUsedNow(b, today);
  const eff = Engine.annualEffective(b);
  const nom = Engine.annualNominal(b);
  const dToReset = Engine.daysToReset(b.reset_cadence, today, b.multi_year_years);
  const soon = Engine.isExpiringSoon(b, today);
  const units = b.expected_units == null ? 0 : b.expected_units;
  const unit = b.unit_label || "use";
  const unitsLabel = `${units} ${units === 1 ? unit : unit + "s"}/yr`;

  const toggleUsed = () => {
    if (usedNow) onPatch({ used: false, used_period_key: null });
    else {
      const { key } = Engine.currentPeriod(b.reset_cadence, today, b.multi_year_years);
      onPatch({ used: true, used_period_key: key });
    }
  };

  // Auto on: the manual stamp is now dead weight, so clear it — and turning auto
  // back off then lands on a clean "unused this period" instead of a stale ✓.
  const toggleAuto = () => onPatch({ auto_credit: !auto, used: false, used_period_key: null });

  return (
    <div className="benefit">
      <div className="b-main">
        <div className="b-name">
          <span>{b.name}</span>
          <span className="b-face">{money(b.face_value, b.face_value % 1 ? 2 : 0)}{isUsage ? ` / ${unit}` : ""}</span>
          <span className="cadence">{isUsage ? `per ${unit}` : CADENCE_LABEL[b.reset_cadence]}</span>
          {auto ? <span className="auto-flag">⟲ automatic — no action needed</span>
            : usedNow && <span className="used-flag">✓ used this period</span>}
        </div>
        {isUsage ? (
          <div className="b-reset">
            {unitsLabel} × {money(b.face_value)} × {Engine.clampRate(b.realization_rate)}% = <b style={{ color: "var(--text)" }}>{money(eff)}/yr</b> · {money(nom)}/yr at sticker
          </div>
        ) : (
          <div className="b-reset" style={soon && !usedNow ? { color: dToReset === 0 ? "var(--bad)" : "var(--warn)", fontWeight: 600 } : null}>
            {auto ? `posts ${CADENCE_LABEL[b.reset_cadence]} on its own` : resetLabel(b, today)}
            {nom !== b.face_value ? ` · ${money(nom)}/yr face` : ""}
          </div>
        )}
        <div className="b-note">
          <textarea
            placeholder="Note…"
            value={b.note || ""}
            onChange={(e) => onPatch({ note: e.target.value })}
          />
        </div>
      </div>

      <div className="b-controls">
        {isUsage ? (
          <div className="stepper" title="How many per year you realistically use">
            <button onClick={() => onPatch({ expected_units: Math.max(0, units - 1) })} aria-label="one fewer">−</button>
            <span className="units">{unitsLabel}</span>
            <button onClick={() => onPatch({ expected_units: units + 1 })} aria-label="one more">+</button>
          </div>
        ) : (
          <div className="use-ctl">
            {!auto && <Switch on={usedNow} onChange={toggleUsed} />}
            <button className={"auto-btn" + (auto ? " on" : "")} onClick={toggleAuto}
              aria-pressed={auto}
              title={auto
                ? "Recurring: this credit posts every period on its own, so Perq counts it and never asks. Click to track it by hand again."
                : "Recurring — this credit posts every period on its own (a membership fee, a subscription). Perq will count it and stop asking."}>
              ⟲ Auto
            </button>
          </div>
        )}
        <Seg value={b.value_type} onChange={(v) => onPatch(coerceType(b, v))} />
        {(b.value_type === "induced" || isUsage) && (
          <div className="slider" title={isUsage ? "How much of the per-unit sticker value you actually capture" : "Realization rate — how much of the face value you actually capture"}>
            <input type="range" min="0" max="100" value={b.realization_rate}
              onChange={(e) => onPatch({ realization_rate: parseInt(e.target.value, 10) })} />
            <span className="pct">{b.realization_rate}%</span>
          </div>
        )}
        <div className="b-eff">
          <div className="e-val">{money(eff)}</div>
          <div className="e-lbl">eff / yr</div>
        </div>
      </div>
    </div>
  );
}

// ---------- account / phone-sync modal ----------
function AccountModal({ session, cloud, onSignIn, onSignUp, onSignOut, onSyncNow, onClose }) {
  const [email, setEmail] = useState("");
  const [pw, setPw] = useState("");
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null); // { text, err }

  async function run(fn, okText) {
    if (!email || !pw) { setMsg({ text: "Email and password, both.", err: true }); return; }
    setBusy(true); setMsg(null);
    const err = await fn(email.trim(), pw);
    setBusy(false);
    if (err) setMsg({ text: err, err: true });
    else if (okText) setMsg({ text: okText, err: false });
