  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <h2>{session ? "Cloud sync" : "Sync across devices"}</h2>
          <button className="ghost tiny" onClick={onClose}>✕ Close</button>
        </div>
        <div className="modal-body">
          {session ? (
            <div>
              <div className="account-whoami">
                Signed in as <b>{session.user.email}</b>
                {cloud.last ? <> · last synced {cloud.last.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}</> : null}
              </div>
              {cloud.error && <div className="account-msg err" style={{ padding: "6px 4px" }}>{cloud.error}</div>}
              <div className="account-msg" style={{ padding: "4px 4px 10px" }}>
                Every change on this device is pushed to your private cloud copy, and other
                signed-in devices pick it up when they open. Sign in with the same account
                on your phone's browser to get the same dashboard there.
              </div>
              <div className="account-form" style={{ paddingTop: 0 }}>
                <div className="row">
                  <button onClick={onSyncNow} disabled={busy}>⟳ Sync now</button>
                  <button className="danger" onClick={onSignOut} disabled={busy}>Sign out</button>
                </div>
              </div>
            </div>
          ) : (
            <div className="account-form">
              <div className="account-msg">
                One account, your data on every device — sign in here and on your phone.
                Data is stored privately in the cloud (row-level security, only your login can read it).
                This device keeps working offline; local + file auto-save stay untouched.
              </div>
              <input type="email" placeholder="Email" value={email} autoComplete="username"
                onChange={(e) => setEmail(e.target.value)} />
              <input type="password" placeholder="Password" value={pw} autoComplete="current-password"
                onChange={(e) => setPw(e.target.value)} />
              {msg && <div className={"account-msg" + (msg.err ? " err" : "")}>{msg.text}</div>}
              <div className="row">
                <button className="primary" disabled={busy} onClick={() => run(onSignIn)}>{busy ? "…" : "Sign in"}</button>
                <button disabled={busy} onClick={() => run(onSignUp, "Account created. If sign-in doesn't start automatically, confirm via the email we just sent, then sign in.")}>Create account</button>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ---------- root ----------
function App() {
  const [db, setDb] = useState(loadDb);
  const [showAdd, setShowAdd] = useState(false);
  const [tests] = useState(() => runEngineSelfTests());
  const today = useMemo(() => new Date(), []);
  const fileRef = useRef(null);

  // auto-save-to-file state (File System Access API)
  const [fileName, setFileName] = useState(null);   // active linked file
  const [canResume, setCanResume] = useState(null);  // remembered file to re-grant
  const [fsStatus, setFsStatus] = useState(null);    // 'saving' | 'saved' | 'error'
  const [lastSave, setLastSave] = useState(null);
  const [lsFlash, setLsFlash] = useState(false);     // brief in-browser save flash
  const handleRef = useRef(null);
  const saveTimer = useRef(null);

  // cloud sync state (Supabase). The library loads from a CDN — if it didn't
  // (offline first paint), the feature simply stays hidden this session.
  const CLOUD_AVAILABLE = typeof window.supabase !== "undefined" && window.supabase.createClient;
  const [session, setSession] = useState(null);
  const [cloud, setCloud] = useState({ status: "idle", last: null, error: null }); // idle|syncing|synced|error
  const [showAccount, setShowAccount] = useState(false);
  const sbRef = useRef(null);
  const dbRef = useRef(db); dbRef.current = db;
  const sessionRef = useRef(null); sessionRef.current = session;
  const applyingCloud = useRef(false); // a pull is landing — don't mark it dirty
  const bootRef = useRef(true);        // initial mount isn't a user change
  const pushTimer = useRef(null);
  const syncChain = useRef(Promise.resolve()); // single-flight: pushes/pulls never interleave
  const authGen = useRef(0);           // bumped on sign-out so stragglers drop their bookkeeping

  // On load, see if a file was linked in a prior session. If permission is still
  // granted, resume silently; otherwise offer a one-click Resume (browsers require
  // a fresh gesture to re-grant file write permission).
  useEffect(() => {
    if (!FSA_SUPPORTED) return;
    (async () => {
      const h = await idbLoadHandle();
      if (!h) return;
      let perm = "prompt";
      try { perm = await h.queryPermission({ mode: "readwrite" }); } catch (e) { /* older API */ }
      if (perm === "granted") { handleRef.current = h; setFileName(h.name); }
      else setCanResume(h.name);
    })();
  }, []);

  // Every change: always persist to localStorage (instant, reliable), and if a
  // file is linked, debounce-write the same JSON to it so the file mirrors state.
  useEffect(() => {
    saveDb(db);
    setLsFlash(true);
    const clr = setTimeout(() => setLsFlash(false), 800);
    if (handleRef.current) {
      setFsStatus("saving");
      clearTimeout(saveTimer.current);
      saveTimer.current = setTimeout(async () => {
        try { await writeHandle(handleRef.current, db); setFsStatus("saved"); setLastSave(new Date()); }
        catch (e) { console.error("[Perq] file auto-save failed:", e); setFsStatus("error"); }
      }, 600);
    }
    return () => clearTimeout(clr);
  }, [db]);

  async function linkAutoSave() {
    try {
      const h = await window.showSaveFilePicker({
        suggestedName: "perq-data.json",
        types: [{ description: "Perq data", accept: { "application/json": [".json"] } }],
      });
      handleRef.current = h; setFileName(h.name); setCanResume(null);
      await writeHandle(h, db); setFsStatus("saved"); setLastSave(new Date());
      await idbSaveHandle(h);
    } catch (e) {
      if (e && e.name === "AbortError") return;            // user cancelled the picker
      console.error("[Perq] could not link file:", e);
      alert("Could not link a file for auto-save.");
    }
  }

  async function resumeAutoSave() {
    try {
      const h = await idbLoadHandle();
      if (!h) { setCanResume(null); return; }
      const perm = await h.requestPermission({ mode: "readwrite" });
      if (perm !== "granted") { alert("Permission denied — auto-save not resumed."); return; }
      handleRef.current = h; setFileName(h.name); setCanResume(null);
      await writeHandle(h, db); setFsStatus("saved"); setLastSave(new Date());
    } catch (e) { console.error("[Perq] resume failed:", e); }
  }

  async function stopAutoSave() {
    handleRef.current = null; setFileName(null); setFsStatus(null); setCanResume(null);
    await idbClearHandle();
  }

  // ---------- cloud sync ----------
  useEffect(() => {
    if (!CLOUD_AVAILABLE) return;
    const client = window.supabase.createClient(PERQ_SUPABASE.url, PERQ_SUPABASE.key);
    sbRef.current = client;
    client.auth.getSession().then(({ data }) => setSession((data && data.session) || null));
    const { data: sub } = client.auth.onAuthStateChange((_event, s) => setSession(s));
    return () => sub.subscription.unsubscribe();
  }, []);

  // a session appeared (sign-in, or restored on load): reconcile with the cloud
  useEffect(() => {
    if (session && sbRef.current) startupSync();
  }, [session && session.user.id]);

  // Serialize all cloud operations: two interleaved pushes (each is 4 network
  // round-trips) could land an old upsert after a newer delete and resurrect
  // deleted rows on every device. One at a time, always.
  function runExclusive(fn) {
    const run = syncChain.current.catch(() => {}).then(fn);
    syncChain.current = run.catch(() => {});
    return run;
  }

  // Debounced-change path. A blind push from a long-lived tab would clobber
  // edits another device synced in the meantime — so before pushing, re-check
  // whether the cloud moved past what this device last saw; if it did, fall
  // back to the full decision matrix (pull / LWW / ask) instead.
  async function pushCloudChecked() {
    const client = sbRef.current, sess = sessionRef.current;
    if (!client || !sess) return;
    const { data: meta, error } = await client.from("sync_meta").select("updated_at").maybeSingle();
    if (error) throw error;
    const cloudStamp = (meta && meta.updated_at) || null;
    if (cloudStamp !== (loadSyncState().known_cloud_stamp || null)) return startupSyncInner();
    return pushCloud(dbRef.current);
  }

  async function pushCloud(current) {
    const client = sbRef.current, sess = sessionRef.current;
    if (!client || !sess) return;
    const gen = authGen.current;
    setCloud(c => ({ status: "syncing", last: c.last, error: null }));
    const stamp = new Date().toISOString();
    const changedAt = (loadSyncState().last_change) || null;
    const { cards, benefits } = CloudSync.rowsFromDb(current, sess.user.id, stamp);

    // FK order: cards up first, stale benefits gone before stale cards.
    if (cards.length) {
      const { error } = await client.from("held_cards").upsert(cards);
      if (error) throw error;
    }
    if (benefits.length) {
      const { error } = await client.from("held_benefits").upsert(benefits);
      if (error) throw error;
    }
    let q = client.from("held_benefits").delete().eq("user_id", sess.user.id);
    if (benefits.length) q = q.not("id", "in", pgIdList(benefits.map(b => b.id)));
    const delB = await q; if (delB.error) throw delB.error;
    let qc = client.from("held_cards").delete().eq("user_id", sess.user.id);
    if (cards.length) qc = qc.not("id", "in", pgIdList(cards.map(c => c.id)));
    const delC = await qc; if (delC.error) throw delC.error;
    const meta = await client.from("sync_meta").upsert({ user_id: sess.user.id, updated_at: stamp, device: navigator.platform || "device" });
    if (meta.error) throw meta.error;

    // If sign-out happened mid-push, don't write account A's stamps into the
    // cleared (or account B's) sync state.
    if (gen === authGen.current) {
      const st = loadSyncState();
      saveSyncState({ ...st, known_cloud_stamp: stamp, last_synced: stamp, ever_synced: true,
        // only clear the dirty marker if nothing changed while we were pushing
        last_change: st.last_change === changedAt ? null : st.last_change });
    }
    setCloud({ status: "synced", last: new Date(), error: null });
  }

  async function pullCloud() {
    const client = sbRef.current;
    const gen = authGen.current;
    clearTimeout(pushTimer.current); // a stale debounce must not push over what we're about to adopt
    setCloud(c => ({ status: "syncing", last: c.last, error: null }));
    const [cardsRes, bensRes, metaRes] = await Promise.all([
      client.from("held_cards").select("*").order("added_at"),
      client.from("held_benefits").select("*"),
      client.from("sync_meta").select("updated_at").maybeSingle(),
    ]);
    if (cardsRes.error) throw cardsRes.error;
    if (bensRes.error) throw bensRes.error;
    if (metaRes.error) throw metaRes.error;
    const next = retuneDoorDash2026(seedAutoCredits(reconcileHeldBenefits(syncSeedCatalog(
      CloudSync.dbFromRows(cardsRes.data, bensRes.data, SCHEMA_VERSION)))));
    applyingCloud.current = true;
    setDb(next);
    if (gen === authGen.current) {
      const stamp = (metaRes.data && metaRes.data.updated_at) || new Date().toISOString();
      saveSyncState({ known_cloud_stamp: stamp, last_synced: new Date().toISOString(), ever_synced: true, last_change: null });
    }
    setCloud({ status: "synced", last: new Date(), error: null });
  }

  async function startupSyncInner() {
    const client = sbRef.current;
    setCloud(c => ({ status: "syncing", last: c.last, error: null }));
    const { data: meta, error } = await client.from("sync_meta").select("updated_at").maybeSingle();
    if (error) throw error;
    const st = loadSyncState();
    let dec = CloudSync.syncDecision({
      cloudStamp: meta && meta.updated_at,
      knownCloudStamp: st.known_cloud_stamp || null,
      everSynced: !!st.ever_synced,
      localDirty: !!st.last_change && (!st.last_synced || st.last_change > st.last_synced),
      localChangedAt: st.last_change || null,
    });
    if (dec === "first-sync-conflict") {
      // The only case where silently picking a side could destroy data.
      dec = confirm(
        "Your account already has Perq data from another device.\n\n" +
        "OK = use the CLOUD copy (replaces this device's data).\n" +
        "Cancel = keep THIS device's data (replaces the cloud copy)."
      ) ? "pull" : "push";
      clearTimeout(pushTimer.current); // the answer decides — no stale push behind it
    }
    if (dec === "pull") await pullCloud();
    else if (dec === "push") await pushCloud(dbRef.current);
    else setCloud({ status: "synced", last: new Date(), error: null });
  }

  function startupSync() {
    return runExclusive(startupSyncInner).catch(e => {
      console.error("[Perq] cloud sync failed:", e);
      setCloud({ status: "error", last: null, error: syncErrorText(e) });
    });
  }

  // every local change: stamp it dirty; if signed in, debounce a push
  useEffect(() => {
    if (bootRef.current) { bootRef.current = false; return; }
    if (applyingCloud.current) { applyingCloud.current = false; return; }
    const st = loadSyncState();
    st.last_change = new Date().toISOString();
    saveSyncState(st);
    if (sessionRef.current && sbRef.current) {
      clearTimeout(pushTimer.current);
      pushTimer.current = setTimeout(() => {
        runExclusive(pushCloudChecked).catch(e => {
          console.error("[Perq] cloud push failed:", e);
          setCloud({ status: "error", last: null, error: syncErrorText(e) });
        });
      }, 1200);
    }
  }, [db]);

  async function signInCloud(email, pw) {
    const { error } = await sbRef.current.auth.signInWithPassword({ email, password: pw });
    return error ? syncErrorText(error) : null;
  }
  async function signUpCloud(email, pw) {
    const { error } = await sbRef.current.auth.signUp({ email, password: pw });
    return error ? syncErrorText(error) : null;
  }
  async function signOutCloud() {
    clearTimeout(pushTimer.current);
    authGen.current++; // any in-flight push/pull drops its sync-state bookkeeping
    await sbRef.current.auth.signOut();
    saveSyncState({}); // a different account signing in later starts clean
    setCloud({ status: "idle", last: null, error: null });
    setShowAccount(false);
  }

  const benefitsByCard = useMemo(() => {
    const m = {};
    for (const c of db.held_cards) m[c.id] = [];
    for (const b of db.held_benefits) (m[b.held_card_id] = m[b.held_card_id] || []).push(b);
    for (const k in m) m[k].sort((a, b) => a.sort_order - b.sort_order);
    return m;
  }, [db]);

  const totals = useMemo(
    () => Engine.portfolioTotals(db.held_cards, benefitsByCard),
    [db, benefitsByCard]
  );

  const expiring = useMemo(() => {
    const rows = [];
    for (const c of db.held_cards) {
      for (const b of (benefitsByCard[c.id] || [])) {
        if (Engine.isExpiringSoon(b, today)) {
          rows.push({ card: c, b, d: Engine.daysToReset(b.reset_cadence, today, b.multi_year_years) });
        }
      }
    }
    return rows.sort((a, b) => a.d - b.d);
  }, [db, benefitsByCard, today]);

  // instantiate a catalog template into a held card + held benefits
  function addCard(cat) {
    const { card, benefits } = instantiateCard(cat, db.catalog_benefits);
    setDb(d => ({ ...d, held_cards: [...d.held_cards, card], held_benefits: [...d.held_benefits, ...benefits] }));
    setShowAdd(false);
  }

  function removeCard(card) {
    if (!confirm(`Remove ${card.nickname || card.name}? Your catalog template stays intact.`)) return;
    setDb(d => ({
      ...d,
      held_cards: d.held_cards.filter(c => c.id !== card.id),
      held_benefits: d.held_benefits.filter(b => b.held_card_id !== card.id),
    }));
  }

  function patchBenefit(id, patch) {
    setDb(d => ({ ...d, held_benefits: d.held_benefits.map(b => b.id === id ? { ...b, ...patch } : b) }));
  }

  function exportJson() {
    const blob = new Blob([serializeDb(db)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const d = new Date();
    const stamp = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    a.href = url; a.download = `perq-backup-${stamp}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }

  function importJson(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!parsed || !Array.isArray(parsed.held_cards) || !Array.isArray(parsed.catalog)) {
          alert("That doesn't look like a Perq backup file."); return;
        }
        if (!confirm("Import will replace your current data. Continue?")) return;
        const clean = {
          schema_version: parsed.schema_version || SCHEMA_VERSION,
          catalog: parsed.catalog || [],
          catalog_benefits: parsed.catalog_benefits || [],
          held_cards: parsed.held_cards || [],
          held_benefits: parsed.held_benefits || [],
        };
        setDb(retuneDoorDash2026(seedAutoCredits(reconcileHeldBenefits(syncSeedCatalog(clean)))));
      } catch (err) {
        alert("Couldn't read that file — invalid JSON.");
      } finally {
        if (fileRef.current) fileRef.current.value = "";
      }
    };
    reader.readAsText(file);
  }

  function resetAll() {
    if (!confirm("Reset ALL data back to the seed catalog with no held cards? This clears your tracking.")) return;
    setDb(freshDbFromSeed());
  }

  const heldSorted = db.held_cards.slice().sort((a, b) => (a.added_at || "").localeCompare(b.added_at || ""));
  const netPos = totals.net >= 0;

  return (
    <div className="wrap">
      <header className="app">
        <div className="brand">
          <h1>Perq<span className="dot">.</span></h1>
          <span className="sub">credit-card benefits, honestly valued</span>
        </div>
        <div className="toolbar">
          <button className="primary" onClick={() => setShowAdd(true)}>+ Add card</button>
          {CLOUD_AVAILABLE && !session && (
            <button className="autosave-cta" onClick={() => setShowAccount(true)}
              title="Sign in once here and on your phone — same data everywhere">☁ Phone sync…</button>
          )}
          {FSA_SUPPORTED && !fileName && (
            <button className="autosave-cta" onClick={canResume ? resumeAutoSave : linkAutoSave}
              title={canResume ? `Re-link ${canResume} and resume auto-saving` : "Pick a .json file once; Perq then saves to it automatically on every change"}>
              {canResume ? "⟳ Resume auto-save" : "↓ Auto-save to file…"}
            </button>
          )}
          <button onClick={exportJson} title="Download a one-off backup copy now">↓ Export</button>
          <button onClick={() => fileRef.current && fileRef.current.click()}>↑ Import</button>
          <input ref={fileRef} type="file" accept="application/json,.json" style={{ display: "none" }} onChange={importJson} />
        </div>
      </header>

      {session && (
        <div className="autosave-bar" style={cloud.status === "error" ? { borderLeftColor: "var(--bad)" } : { borderLeftColor: "var(--accent)" }}>
          <span className="as-dot" data-status={cloud.status === "syncing" ? "saving" : cloud.status === "error" ? "error" : "saved"} />
          <span className="as-text">
            Cloud sync · <b>{session.user.email}</b>
            {cloud.status === "syncing" ? " · syncing…"
              : cloud.status === "error" ? <> · <span style={{ color: "var(--bad)", fontWeight: 600 }}>{cloud.error || "sync failed"}</span></>
              : cloud.last ? ` · synced ${cloud.last.toLocaleTimeString([], { hour: "numeric", minute: "2-digit", second: "2-digit" })}` : " · connected"}
          </span>
          <button className="ghost tiny" onClick={startupSync} title="Re-check the cloud copy now">⟳ Sync</button>
          <button className="ghost tiny" onClick={() => setShowAccount(true)}>Account</button>
        </div>
      )}

      {fileName && (
        <div className="autosave-bar">
          <span className="as-dot" data-status={fsStatus || "saved"} />
          <span className="as-text">
            Auto-saving to <b>{fileName}</b>
            {fsStatus === "saving" ? " · saving…" : fsStatus === "error" ? " · save failed" :
              lastSave ? ` · saved ${lastSave.toLocaleTimeString([], { hour: "numeric", minute: "2-digit", second: "2-digit" })}` : " · linked"}
          </span>
          <button className="ghost tiny" onClick={stopAutoSave} title="Stop writing to this file (localStorage keeps working)">Stop</button>
        </div>
      )}

      {/* Dashboard totals */}
      <div className="summary">
        <div className="stat">
          <div className="label">Nominal / yr</div>
          <div className="value">{money(totals.nominal)}</div>
          <div className="meta">sum of face values</div>
        </div>
        <div className="stat">
          <div className="label">Effective / yr</div>
          <div className="value">{money(totals.effective)}</div>
          <div className="meta">offset at face · induced &amp; usage discounted</div>
        </div>
        <div className="stat">
          <div className="label">Annual fees</div>
          <div className="value">{money(totals.fees)}</div>
          <div className="meta">{db.held_cards.length} card{db.held_cards.length === 1 ? "" : "s"} held</div>
        </div>
        <div className={"stat net " + (netPos ? "pos" : "neg")}>
          <div className="label">Net / yr</div>
          <div className="value">{netPos ? "+" : "−"}{money(Math.abs(totals.net))}</div>
          <div className="meta">effective − fees</div>
        </div>
      </div>

      {/* Expiring soon */}
      {db.held_cards.length > 0 && (
        <div className={"strip" + (expiring.length ? "" : " empty")}>
          <h2>{expiring.length ? `⏳ Expiring soon — ${expiring.length} unused` : "✓ Nothing expiring in the next 14 days"}</h2>
          {expiring.length ? (
            <div className="chips">
              {expiring.map(({ card, b, d }) => (
                <div className="chip" key={b.id}>
                  <div className="c-card">{card.nickname || card.name}</div>
                  <div className="c-name">{b.name}</div>
                  <div className="c-row">
                    <span className={"c-days " + (d === 0 ? "days-0" : "days-soon")}>
                      {d === 0 ? "resets today" : d === 1 ? "1 day left" : `${d} days left`}
                    </span>
                    <button className="tiny" onClick={() => {
                      const { key } = Engine.currentPeriod(b.reset_cadence, today, b.multi_year_years);
                      patchBenefit(b.id, { used: true, used_period_key: key });
                    }}>Mark used</button>
                  </div>
                </div>
              ))}
            </div>
          ) : <div className="none">All your time-sensitive benefits for this period are used or not due yet.</div>}
        </div>
      )}

      {/* Held cards */}
      {heldSorted.length === 0 ? (
        <div className="empty-state">
          <h3>No cards yet</h3>
          <p>Track what each credit-card benefit is really worth against its annual fee. Pick up where you left off, or start from the catalog.</p>
          <div className="empty-actions">
            {CLOUD_AVAILABLE && !session && (
              <button className="primary" onClick={() => setShowAccount(true)}
                title="Sign in to pull your data from the cloud">☁ Sign in for cloud sync</button>
            )}
            <button className={CLOUD_AVAILABLE && !session ? "" : "primary"} onClick={() => setShowAdd(true)}>+ Add a card</button>
            <button onClick={() => fileRef.current && fileRef.current.click()}
              title="Restore from a Perq backup file">↑ Import backup JSON</button>
          </div>
        </div>
      ) : (
        heldSorted.map(card => (
          <CardSection key={card.id} card={card} benefits={benefitsByCard[card.id] || []}
            today={today} onPatchBenefit={patchBenefit} onRemove={removeCard} />
        ))
      )}

      {showAdd && <AddCardModal db={db} onAdd={addCard} onClose={() => setShowAdd(false)} />}
      {showAccount && (
        <AccountModal session={session} cloud={cloud}
          onSignIn={signInCloud} onSignUp={signUpCloud} onSignOut={signOutCloud}
          onSyncNow={startupSync} onClose={() => setShowAccount(false)} />
      )}

      <footer className="app">
        <span>
          {fileName
            ? <>Saved to <b>{fileName}</b> on every change{lsFlash ? " ·" : ""} <span style={{ color: "var(--good)" }}>{lsFlash ? "●" : ""}</span></>
            : <>Saved in this browser{lsFlash ? <span style={{ color: "var(--good)" }}> ●</span> : ""}.{" "}
                {FSA_SUPPORTED ? "Use “Auto-save to file” for a real backup file." : "Use Export to back up (your browser can’t auto-save to a file)."}</>}
          {"  "}<a onClick={resetAll}>{PERQ_SHELL ? "Clear all data" : "Reset to seed"}</a>
        </span>
        <span className={"tests " + (tests.failed.length ? "fail" : "ok")}>
          engine self-tests: {tests.passed}/{tests.total} {tests.failed.length ? "FAILED" : "passed"}
        </span>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<script>
// Service worker — feature-detected and non-blocking; failures are silent (the
// app works identically without it, it just isn't installable/offline-capable).
// Relative path: works on GitHub Pages under /perq-app-shell/; the register()
// promise rejects silently on file://.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
